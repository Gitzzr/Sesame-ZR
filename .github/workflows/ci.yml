name: ✅PR Check
run-name: ✅ ${{ github.actor }} · ${{ github.ref_name }}

# GitHub Flow 的校验门禁：PR 与主干推送都跑这一条。
# 只做「能不能构建 + 测试过不过」，不做签名与分发 —— 那些属于发版职责，在 android.yml。
# 与 android.yml 分开的原因：签名需要 4 个 secrets，缺一个就必红；
# 把签名混进 PR 校验会让门禁永远失效（没人会认真看待一条恒定失败的红叉）。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 同一分支上新的推送会取消上一次未跑完的运行，省掉排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Set Timezone to Asia/Shanghai
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 👨🏻‍💻 Checkout
        uses: actions/checkout@v7
        with:
          # versionCode 已改为「自 2020-01-01 起的分钟数」，不再依赖提交历史，
          # 浅克隆也不会让版本号出错。仍保留完整克隆是为了其它依赖 git 历史的步骤。
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: ☕ Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: 🤝 Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: ☎️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 📝 CHANGELOG 片段格式校验
        # 片段模式：PR 阶段只新增 changelog.d/*.md（新文件，永不冲突），
        # 并由汇总步骤统一并入 CHANGELOG.md。这里只校验已提交片段的格式与长度。
        run: python3 scripts/changelog_fragments.py --check

      - name: 💡 提醒：改了生产代码但没有 CHANGELOG 片段
        # 只是提醒，不失败 —— 内部重构、日志格式等改动按约定本就不需要片段。
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          code_changed=$(git diff --name-only "$base"...HEAD -- 'app/src/main/**' | head -1)
          fragments=$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'changelog.d/*.md' | grep -v 'README.md' | head -1)
          if [ -n "$code_changed" ] && [ -z "$fragments" ]; then
            echo "::warning title=缺少 CHANGELOG 片段::本次改动了 app/src/main/，但没有新增 changelog.d/*.md。"
            echo "若该改动用户可见，请补一个片段（写法见 docs/development.md §4）；若属内部重构/日志格式等，忽略此提醒即可。"
          else
            echo "CHANGELOG 片段检查通过（或本次未改动生产代码）"
          fi

      - name: 🔨 Build debug（含 aapt2 资源处理与打包）
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 🧪 Unit tests（Kotlin / JVM）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 🧪 Unit tests（Web JS 合同，node:test，无 npm 依赖）
        # 必须显式给 glob：`node --test <目录>` 在 Node 22 下会把目录当脚本执行并失败
        run: node --test app/src/test/js/*.test.js

      - name: 📊 Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: 📦 Upload debug APK（universal）
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: ignore
